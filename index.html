<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percorsi</title>
    <link rel="stylesheet" href="./style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <!-- Choices -->
    <div class="choices">
        <button type="button" id="dijkstra" onclick="selectAlgorithm('Dijkstra')">Dijkstra</button>
        <button type="button" id="astar" onclick="selectAlgorithm('Astar')">A*</button>
    </div>
    <main class="map flex items-center justify-center gap-10">
        <!-- <div id="mapRef"></div> -->
        <div
            class="circle h-20 w-20 flex bg-[var(--main)] rounded-full text-2xl items-center justify-center relative overflow-visible z-10">
            0
        </div>

        <div class="column flex gap-20 flex-col">
            <div class="pair flex gap-20">
                <div
                    class="circle h-20 w-20 flex bg-[var(--main)] rounded-full text-2xl items-center justify-center relative overflow-visible">
                    1
                    <div class="absolute w-32 h-1 bg-[var(--main)] -left-full bottom-0 rotate-[-35deg]"></div>
                    <div class="absolute w-40 h-1 bg-[var(--main)] -bottom-full rotate-90"></div>
                </div>
                <div
                    class="circle h-20 w-20 flex bg-[var(--main)] rounded-full text-2xl items-center justify-center relative overflow-visible">
                    4
                    <div class="absolute w-28 h-1 bg-[var(--main)] -left-full"></div>
                    <div class="absolute w-40 h-1 bg-[var(--main)] -bottom-full rotate-90"></div>
                </div>
            </div>
            <div class="pair flex gap-20">
                <div
                    class="circle h-20 w-20 flex bg-[var(--main)] rounded-full text-2xl items-center justify-center relative overflow-visible">
                    2
                    <div class="absolute w-28 h-1 bg-[var(--main)] -left-full top-0 rotate-[35deg]"></div>
                </div>
                <div
                    class="circle h-20 w-20 flex bg-[var(--main)] rounded-full text-2xl items-center justify-center relative overflow-visible">
                    3
                    <div class="absolute w-24 h-1 bg-[var(--main)] -left-full"></div>
                </div>
            </div>
        </div>



    </main>
    <script src="./script.js"></script>
</body>

</html>
